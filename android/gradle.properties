org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

org.gradle.workers.max=2
# Work around Kotlin incremental-cache registration failures during Android builds.
# Remove after the Kotlin Gradle plugin no longer hits this cache collision.
kotlin.incremental=false
# The app derives ABI filters from Flutter's requested target platforms.
disable-abi-filtering=true
